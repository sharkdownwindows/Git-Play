name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · test · build · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # allowScripts trong package.json cho phép esbuild chạy postinstall.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit test
        run: npm test

      - name: Ràng buộc phụ thuộc (core/ và progress/ sạch)
        run: npm run lint:imports

      - name: Production build
        run: npm run build

  differential:
    name: differential depth 2 (Git 2.43)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install and verify Git 2.43
        run: |
          sudo apt-get update
          git_pkg=$(apt-cache madison git | awk '$3 ~ /^1:2\.43\./ { print $3; exit }')
          test -n "$git_pkg"
          sudo apt-get install -y --allow-downgrades "git=$git_pkg" "git-man=$git_pkg"
          /usr/bin/git --version | grep -Eq '^git version 2\.43\.'
          echo /usr/bin >> "$GITHUB_PATH"
      - name: Differential gate
        run: |
          git --version | grep -Eq '^git version 2\.43\.'
          npm run diff:quick

  browser-smoke:
    name: browser smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install headless Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Verify Chrome executable
        env:
          GITSCOPE_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          test -n "$GITSCOPE_BROWSER"
          test -f "$GITSCOPE_BROWSER"
          test -x "$GITSCOPE_BROWSER"
          "$GITSCOPE_BROWSER" --version
      - name: Browser benchmark smoke
        env:
          GITSCOPE_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run bench:browser -- --smoke
